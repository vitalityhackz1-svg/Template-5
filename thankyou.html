<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <style>
    :root { --business-color: #1a6b4a; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap');
    body {
      min-height: 100%; font-family: 'DM Sans', sans-serif;
      background: #f7f5f0; display: flex;
      align-items: center; justify-content: center; padding: 24px 16px;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 48px 32px 40px;
      max-width: 400px; width: 100%; text-align: center; position: relative; overflow: hidden;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 32px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04);
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--business-color), #2dd4a0);
    }
    .icon { font-size: 56px; margin-bottom: 20px; display: block; }
    .heading { font-family: 'DM Serif Display', serif; font-size: 26px; color: #1a1a1a; margin-bottom: 12px; line-height: 1.25; }
    .body { font-size: 15px; color: #777; font-weight: 300; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: block; width: 100%; padding: 15px 20px; border-radius: 14px; border: none;
      font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500;
      cursor: pointer; text-decoration: none; background: var(--business-color); color: #fff;
      transition: all 0.18s ease;
    }
    .btn:hover { background: #155c3e; transform: translateY(-1px); }
    .footer { margin-top: 24px; font-size: 12px; color: #ccc; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .card { animation: fadeUp 0.4s ease both; }
  </style>
</head>
<body>
<div class="card">
  <span class="icon">🙏</span>
  <h1 class="heading">Thank you for your feedback</h1>
  <p class="body">We've received your message and will be in touch with you shortly. Your honesty helps us serve you better.</p>
  <a class="btn" id="back-btn" href="#">← Back to start</a>
  <div class="footer" id="footer-text"></div>
</div>
<script>
  const BUSINESS_NAME = "Vela Studios";
  const MAIN_PAGE_URL = "https://vitalityhackz1-svg.github.io/Template-5/";
  document.getElementById('back-btn').href = MAIN_PAGE_URL;
  document.getElementById('footer-text').textContent = "© " + BUSINESS_NAME;
  document.title = "Thank You — " + BUSINESS_NAME;
</script>
</body>
</html>
